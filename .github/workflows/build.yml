
name: Build Whisper for Synology

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-22.04

    container:
      image: alpine:3.20

    steps:
      - name: Install build tools
        run: |
          apk add --no-cache \
            git cmake make g++ gcc musl-dev linux-headers binutils file

      - name: Download Whisper
        run: |
          git clone --depth 1 --branch v1.7.6 \
            https://github.com/ggml-org/whisper.cpp.git whisper

      - name: Compile static executable
        run: |
          cmake -S whisper -B whisper/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-O2 -march=x86-64 -mtune=generic -mno-avx -mno-avx2 -mno-fma -mno-f16c -mno-bmi -mno-bmi2" \
            -DCMAKE_CXX_FLAGS="-O2 -march=x86-64 -mtune=generic -mno-avx -mno-avx2 -mno-fma -mno-f16c -mno-bmi -mno-bmi2" \
            -DCMAKE_EXE_LINKER_FLAGS="-static" \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU_ALL_VARIANTS=OFF \
            -DGGML_BMI2=OFF \
            -DGGML_SSE42=OFF \
            -DGGML_AVX_VNNI=OFF \
            -DGGML_AVX=OFF \
            -DGGML_AVX2=OFF \
            -DGGML_FMA=OFF \
            -DGGML_F16C=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_BLAS=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_SERVER=OFF

          cmake --build whisper/build -j 2 --verbose

      - name: Verify executable
        run: |
          cp whisper/build/bin/whisper-cli whisper-main
          chmod +x whisper-main
          file whisper-main
          ./whisper-main --help

      - name: Check unsupported instructions
        run: |
          echo "=== Checking for BMI2 instructions ==="

          objdump -d -M intel whisper-main > disassembly.txt

          if grep -Eq '[[:space:]](shlx|shrx|sarx|mulx|rorx|bzhi|pdep|pext)[[:space:]]' disassembly.txt; then
            echo "ERROR: Unsupported BMI2 instructions found"
            grep -E '[[:space:]](shlx|shrx|sarx|mulx|rorx|bzhi|pdep|pext)[[:space:]]' disassembly.txt | head -20
            exit 1
          fi

          echo "PASS: No BMI2 instructions found"

      - name: Package
        run: |
          tar -czf synology-whisper.tar.gz whisper-main

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: synology-whisper
          path: synology-whisper.tar.gz
          retention-days: 7
